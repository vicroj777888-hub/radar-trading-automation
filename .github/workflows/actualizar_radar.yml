name: Actualizar Radar Trading

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  maquina_1:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Instalar dependencias
        run: pip install yfinance pandas numpy gspread google-auth tzdata
      - name: Ejecutar script de actualización
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          PYTHONIOENCODING: utf-8
        run: python main.py

  maquina_2:
    needs: maquina_1
    if: ${{ failure() }}
    runs-on: ubuntu-22.04
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Instalar dependencias
        run: pip install yfinance pandas numpy gspread google-auth tzdata
      - name: Ejecutar script de actualización
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          PYTHONIOENCODING: utf-8
        run: python main.py

  maquina_3:
    needs: maquina_2
    if: ${{ failure() }}
    runs-on: windows-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Instalar dependencias
        run: pip install yfinance pandas numpy gspread google-auth tzdata
      - name: Ejecutar script de actualización
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          PYTHONIOENCODING: utf-8
        run: python main.py
