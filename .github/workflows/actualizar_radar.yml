name: Actualizar Radar Trading

# GitHub cron solo acepta UTC: este cron cubre 13-21 UTC (verano e invierno)
# y main.py decide en America/New_York si es ventana de escaneo.
on:
  schedule:
    - cron: '1,5,31,58 13-21 * * 1-5'
  workflow_dispatch:

concurrency:
  group: radar-francotirador
  cancel-in-progress: false

jobs:
  maquina_1:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      FUERZA: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install -r requirements.txt
      - name: Ejecutar
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONIOENCODING: utf-8
        run: python main.py

  maquina_2:
    needs: maquina_1
    if: ${{ failure() }}
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    env:
      FUERZA: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install -r requirements.txt
      - name: Ejecutar
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONIOENCODING: utf-8
        run: python main.py

  maquina_3:
    needs: maquina_2
    if: ${{ failure() }}
    runs-on: windows-latest
    timeout-minutes: 12
    env:
      FUERZA: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install -r requirements.txt
      - name: Ejecutar
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONIOENCODING: utf-8
        run: python main.py
