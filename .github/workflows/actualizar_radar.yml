name: Actualizar Radar Trading

on:
  schedule:
    # Se ejecuta cada hora en punto (hora UTC)
    - cron: '0 * * * *'
  # También permite ejecutarlo manualmente desde GitHub
  workflow_dispatch:

jobs:
  actualizar:
    runs-on: ubuntu-latest
    
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v3
      
      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Instalar dependencias
        run: |
          pip install yfinance pandas numpy gspread google-auth oauth2client
      
      - name: Ejecutar script de actualización
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: |
          python main.py
