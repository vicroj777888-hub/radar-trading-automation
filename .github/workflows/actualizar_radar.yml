name: Actualizar Radar Trading

on:
  schedule:
    - cron: '31 13 * * 1-5'
    - cron: '1 14-20 * * 1-5'
    - cron: '58 19 * * 1-5'
    - cron: '58 20 * * 1-5'
  workflow_dispatch:

concurrency:
  group: radar-francotirador
  cancel-in-progress: false

jobs:
  maquina_1:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install yfinance pandas numpy gspread google-auth tzdata requests
      - name: Ejecutar
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONIOENCODING: utf-8
        run: python main.py

  maquina_2:
    needs: maquina_1
    if: ${{ failure() }}
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install yfinance pandas numpy gspread google-auth tzdata requests
      - name: Ejecutar
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONIOENCODING: utf-8
        run: python main.py

  maquina_3:
    needs: maquina_2
    if: ${{ failure() }}
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install yfinance pandas numpy gspread google-auth tzdata requests
      - name: Ejecutar
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONIOENCODING: utf-8
        run: python main.py
